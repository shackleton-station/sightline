<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Scout's mark as the tab icon. The site has no step that makes PNG or Apple touch icons, so
         there is the SVG alone, as on the other pages. -->
    <link rel="icon" type="image/svg+xml" href="/sightline-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The name first, so it survives a narrow tab. In Plan the page puts the scenario first
         (src/lib/sightline.ts, tabTitle). -->
    <title>Sightline · Lunar landing site planner</title>
    <!-- The front page. The same screen also answers at /sightline/, its address while it was being built. -->
    <meta name="description" content="Where to land on the Moon, and when. See the hours a landing site has sunlight for power and Earth in view for radio." />
    <meta name="theme-color" content="#000000" />
    <!-- A 60 kB still of the Moon, asked for with the page so a Moon is on screen before the globe's
         code and maps arrive. -->
    <link rel="preload" as="image" href="/data/maps/moon_poster.jpg" fetchpriority="high" />

    <!-- What LinkedIn, Slack, iMessage and X show when the link is shared. The image is the site's
         own share image; its address must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shackleton Station" />
    <meta property="og:url" content="https://lunarsightline.com/" />
    <meta property="og:title" content="Sightline" />
    <meta property="og:description" content="Where to land on the Moon, and when. See the hours a landing site has sunlight for power and Earth in view for radio." />
    <meta property="og:image" content="https://lunarsightline.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sunlit Moon globe with landing sites marked near the south pole, beside the question: Where on the Moon can we land, and when?" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sightline/main.tsx"></script>
  </body>
</html>
