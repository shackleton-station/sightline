name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Code freeze. From this moment (UTC) every pull request fails CI, so nothing more merges to main.
  # 2026-11-15T18:00:00Z is Sunday Nov 15, 1:00 PM Eastern. Set it to "" to lift the freeze: a pull
  # request is checked with its own copy of this file, so the one that lifts it can pass.
  # A guard rail, not a lock. Admins can merge past a red check, and a pull request that was green
  # before the freeze stays green until its next commit. The lock is "Lock branch" on main (admin).
  FREEZE_AT: "2026-11-15T18:00:00Z"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Code freeze
        if: github.event_name == 'pull_request' && env.FREEZE_AT != ''
        # Before the checkout, so the job's own folder is not there yet.
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$FREEZE_AT" +%s)" ]; then
            echo "::error::Code freeze since $FREEZE_AT: main takes no more merges. See FREEZE_AT in .github/workflows/ci.yml."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag published; pin exact release
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    name: web (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Code freeze
        if: github.event_name == 'pull_request' && env.FREEZE_AT != ''
        # Before the checkout, so the job's own folder is not there yet.
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$FREEZE_AT" +%s)" ]; then
            echo "::error::Code freeze since $FREEZE_AT: main takes no more merges. See FREEZE_AT in .github/workflows/ci.yml."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The root tsconfig has no files of its own; `tsc -b` checks the referenced app + node projects.
      - run: npx tsc -b
      - run: npx vitest run
      # No Cesium token in CI: the 3D view must fall back to its placeholder.
      - run: npm run build
      # The events worker is a second program built from this folder (events-worker/ and shared/).
      - run: npm run build:worker
      # The plans service is a third (plans/ and shared/, with the page's calculations from src/lib/).
      - run: npm run build:plans
      # The co-pilot service is a fourth (copilot/ and shared/, with the page's calculations from src/lib/).
      - run: npm run build:copilot
